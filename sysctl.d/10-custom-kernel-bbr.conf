# enable bbr
# @see https://gist.github.com/duzun/1503ebefbb208b9072ef85b7190364a4
#
# The matching `net.core.default_qdisc = fq` lives in
# 50-traffic-optimization.conf: systemd's /usr/lib/sysctl.d/50-default.conf
# sets fq_codel and would override it from a 10-* file.
net.ipv4.tcp_congestion_control = bbr
