# Kernel modules loaded at boot for faure.sh.
#
# systemd-modules-load.service runs before systemd-sysctl.service, so loading
# nf_conntrack here makes the net.netfilter.nf_conntrack_* keys from
# sysctl.d/20-network-performance.conf exist when sysctl.d is applied.
# Without it they are silently skipped and the kernel defaults stay active.
nf_conntrack
